name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is a CPU-only build (Metal is enabled on Apple only).
        os: [macos-15, ubuntu-latest]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ccache
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install --yes ccache
          fi

      - name: Read llama.cpp revision
        id: llama
        run: echo "sha=$(git -C deps/llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore llama.cpp compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ steps.llama.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        run: ctest --test-dir build --output-on-failure
