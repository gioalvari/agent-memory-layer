[project]
name = "conformal-retrieval-study"
version = "0.1.0"
description = "Offline split-conformal memory retrieval study"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
